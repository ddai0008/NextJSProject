name: pipewise

services:
  postgres:
    image: postgres:18
    # pg_stat_statements lets the activity tests count the queries a page runs, across processes.
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements", "-c", "pg_stat_statements.track=all"]
    environment:
      # The superuser the container is created with. The tooling (npm run db:up) creates the ordinary role `crm` that owns the databases.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
